[project]
name = "dataplatform-client"
version = "0.1.0"
description = "Sample application consuming the data platform mockup over MCP and A2A."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.5,<2",
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
]

[project.scripts]
dataplatform-client = "dataplatform_client.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dataplatform",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
dataplatform = { path = "../server", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "D", "C4", "PT", "ASYNC"]
ignore = ["D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["should_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers --cov=dataplatform_client --cov-report=term-missing --cov-fail-under=80"
