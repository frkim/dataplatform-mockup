[project]
name = "dataplatform"
version = "0.1.0"
description = "Mock Snowflake/Databricks-like data platform exposing REST, MCP and A2A endpoints."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.1.5,<2",
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "mcp>=2.2.0,<3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dataplatform = "dataplatform.main:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "D", "C4", "PT", "ASYNC"]
ignore = ["D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S608"]
# Agents show the SQL they generate (like Genie / Cortex Analyst), so values are inlined as literals.
# They only come from the data vocabulary, numbers or catalog metadata, never raw user text, and all SQL
# runs in the read-only engine sandbox.
"src/dataplatform/agents/*.py" = ["S608"]
# Synthetic sample data, not cryptography.
"src/dataplatform/infrastructure/sample_data.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["a2a.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["should_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers --cov=dataplatform --cov-report=term-missing --cov-fail-under=80"
