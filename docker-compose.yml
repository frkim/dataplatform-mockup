# Local stack: the data platform (REST + MCP + A2A) and the web console.
# The sample client runs on the host against http://localhost:8000 (see README).
name: dataplatform-mockup

services:
  server:
    build:
      context: ./server
    image: dataplatform-mockup/server:local
    environment:
      DATAPLATFORM_HOST: 0.0.0.0
      DATAPLATFORM_PORT: '8000'
      DATAPLATFORM_PUBLIC_BASE_URL: http://localhost:8000
      DATAPLATFORM_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATAPLATFORM_LOG_LEVEL: INFO
    ports:
      - '127.0.0.1:8000:8000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      args:
        PLATFORM_API_URL: http://server:8000
    image: dataplatform-mockup/web:local
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true
